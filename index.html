<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPMC Security KTD Assessment Portal</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#003366;
}

.portal-title{
    text-align:center;
    color:#666;
    font-weight:normal;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#003366;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>DPMC Security</h1>

<h2 class="portal-title">
Knowledge Transfer Day Assessment Portal
</h2>

<input
type="email"
id="email"
placeholder="Enter your registered email address">

<button onclick="searchResults()">
View Results
</button>

</div>

<script>

function searchResults(){

const email =
document.getElementById("email").value;

if(!email){

alert("Please enter your email address.");

return;

}

window.location.href =
"results.html?email=" +
encodeURIComponent(email);

}

</script>

</body>
</html>

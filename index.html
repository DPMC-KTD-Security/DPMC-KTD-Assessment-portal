<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DPMC-KTD Security Training Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a5f);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    background:#003366;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    margin:0 auto 20px;
}

h1{
    color:#003366;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:10px;
}

.description{
    color:#777;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#003366;
}

button{
    width:100%;
    padding:14px;
    background:#003366;
    color:white;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0055a5;
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#888;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">🛡️</div>

    <h1>DPMC-KTD</h1>

    <p class="subtitle">
        Security Training Portal
    </p>

    <p class="description">
        Access your assigned training modules,
        learning materials, assessments, and certifications.
    </p>

    <input
        type="email"
        id="email"
        placeholder="Enter your registered email address">

    <button onclick="loginPortal()">
        Continue
    </button>

    <div class="footer">
        Learning • Compliance • Development
    </div>

</div>

<script>

function loginPortal(){

    const email =
        document.getElementById("email").value.trim();

    if(!email){
        alert("Please enter your email address.");
        return;
    }

    window.location.href =
        "objectives.html?email=" +
        encodeURIComponent(email);
}

</script>

</body>
</html>

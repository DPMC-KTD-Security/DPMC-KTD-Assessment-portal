<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPMC Security KTD Assessment Portal</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
}

h1{
    text-align:center;
    color:#003366;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#003366;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.card{
    margin-top:15px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fafafa;
}

.passed{
    color:green;
    font-weight:bold;
}

.failed{
    color:red;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>DPMC Security KTD Assessment Portal</h1>

<p class="subtitle">
Enter your registered email address to view assessment results.
</p>

<input
type="email"
id="email"
placeholder="example@email.com">

<button onclick="searchResults()">
View Results
</button>

<div id="results"></div>

</div>

<script>

async function searchResults(){

const email =
document.getElementById("email").value;

document.getElementById("results").innerHTML =
"<p>Loading assessment records...</p>";

try{

const response = await fetch(
"https://script.google.com/macros/s/AKfycbzs-rKuvbQ1rkbHyzeZ1k1BpWO_X_phusbmdG2XBxd7DeKPbLkOHJUZV0SoDPFCXAkjRA/exec?email="
+ encodeURIComponent(email)
);

const data = await response.json();

let html = "";

if(data.length === 0){

html = "<h3>No assessment records found.</h3>";

}else{

data.forEach(item=>{

const statusClass =
item.status.toLowerCase().includes("pass")
? "passed"
: "failed";

html += `
<div class="card">

<h2>${item.assessment}</h2>

<p><strong>Name:</strong> ${item.name}</p>
<p><strong>Email:</strong> ${item.email}</p>
<p><strong>Property:</strong> ${item.property}</p>
<p><strong>Agency:</strong> ${item.agency}</p>
<p><strong>Score:</strong> ${item.score}</p>
<p><strong>Stage:</strong> ${item.stage}</p>

<p>
<strong>Status:</strong>
<span class="${statusClass}">
${item.status}
</span>
</p>

</div>
`;

});

}

document.getElementById("results").innerHTML =
html;

}catch(error){

console.error(error);

document.getElementById("results").innerHTML =
"<p>Error loading assessment records.</p>";

}

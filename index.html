<script>

async function searchResults() {

  const email =
  document.getElementById("email").value;

  document.getElementById("results").innerHTML =
  "<p>Loading assessment records...</p>";

  try {

    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbzs-rKuvbQ1rkbHyzeZ1k1BpWO_X_phusbmdG2XBxd7DeKPbLkOHJUZV0SoDPFCXAkjRA/exec?email=" +
      encodeURIComponent(email)
    );

    const data = await response.json();

    if (data.length === 0) {

      document.getElementById("results").innerHTML =
      "<h3>No assessment records found.</h3>";

      return;

    }

    const name = data[0].name;
    const emailAddress = data[0].email;
    const property = data[0].property;
    const agency = data[0].agency;

    const passedCount = data.filter(item =>
      item.status.toLowerCase().includes("pass")
    ).length;

    const failedCount = data.filter(item =>
      item.status.toLowerCase().includes("fail")
    ).length;

    let html = `
    <div class="summary-card">

      <h2>Assessment Summary</h2>

      <p><strong>Name:</strong> ${name}</p>
      <p><strong>Email:</strong> ${emailAddress}</p>
      <p><strong>Property:</strong> ${property}</p>
      <p><strong>Agency:</strong> ${agency}</p>

      <hr>

      <p><strong>Total Assessments:</strong> ${data.length}</p>

      <p style="color:#90EE90;">
      <strong>Passed:</strong> ${passedCount}
      </p>

      <p style="color:#FFB6C1;">
      <strong>Failed:</strong> ${failedCount}
      </p>

    </div>
    `;

    data.forEach(item => {

      const statusClass =
      item.status.toLowerCase().includes("pass")
      ? "pass"
      : "fail";

      html += `
      <div class="assessment-card">

        <h3>${item.assessment}</h3>

        <p><strong>Score:</strong> ${item.score}</p>

        <p><strong>Stage:</strong> ${item.stage}</p>

        <p>
          <strong>Status:</strong>
          <span class="${statusClass}">
            ${item.status}
          </span>
        </p>

      </div>
      `;

    });

    document.getElementById("results").innerHTML =
    html;

  } catch(error) {

    console.error(error);

    document.getElementById("results").innerHTML =
    "<p>Error loading assessment records.</p>";

  }

}

</script>

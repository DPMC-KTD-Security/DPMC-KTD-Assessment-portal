<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agency Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(
        135deg,
        #f5f9ff 0%,
        #eef4ff 50%,
        #dbeafe 100%
    );
    min-height:100vh;
}

.main{
    padding:40px;
}

.welcome{
    margin-bottom:30px;
}

.welcome h1{
    font-size:42px;
    color:#0f172a;
    margin-bottom:8px;
}

.agency-name{
    font-size:22px;
    font-weight:600;
    color:#2563eb;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
    margin-bottom:24px;
}

.card{
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(15px);
    border-radius:24px;
    padding:28px;
    border:1px solid rgba(255,255,255,.5);
    box-shadow:
        0 10px 30px rgba(37,99,235,.12),
        0 0 20px rgba(37,99,235,.05);
    position:relative;
    overflow:hidden;
    transition:.3s ease;
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:5px;
    background:linear-gradient(
        90deg,
        #003366,
        #2563eb,
        #60a5fa
    );
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:
        0 18px 40px rgba(37,99,235,.20),
        0 0 25px rgba(59,130,246,.15);
}

.card h2{
    font-size:17px;
    font-weight:600;
    color:#475569;
    margin-bottom:15px;
}

.card-number{
    font-size:48px;
    font-weight:800;
    background:linear-gradient(
        135deg,
        #003366,
        #2563eb
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.quick-access{
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:
        0 10px 30px rgba(37,99,235,.08);
}

.quick-access h2{
    margin-bottom:20px;
    color:#0f172a;
}

.button{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(
        135deg,
        #003366,
        #2563eb
    );
    color:white;
    padding:14px 22px;
    border-radius:14px;
    margin-right:12px;
    margin-top:10px;
    font-weight:600;
    transition:.3s ease;
    box-shadow:
        0 10px 20px rgba(37,99,235,.20);
}

.button:hover{
    transform:translateY(-3px);
    box-shadow:
        0 15px 30px rgba(37,99,235,.35);
}

@media(max-width:1000px){

    .stats{
        grid-template-columns:1fr;
    }
    
}

</style>

</head>

<body>

<div class="main">

    <div class="welcome">

        <h1>Welcome Back!</h1>

        <div class="agency-name" id="agencyName">
            Loading...
        </div>

    </div>

    <div class="stats">

        <div class="card">

            <h2>📡 Radio Call Compliance</h2>

            <div class="card-number">
                96%
            </div>

        </div>

        <div class="card">

            <h2>🛡️ SNAP Compliance</h2>

            <div class="card-number">
                94%
            </div>

        </div>

        <div class="card">

            <h2>📋 DSR Compliance</h2>

            <div class="card-number">
                92%
            </div>

        </div>

    </div>

    <div class="stats">

        <div class="card">

            <h2>👮 Personnel</h2>

            <div class="card-number" id="personnelCount">
                Loading...
            </div>

        </div>

        <div class="card">

            <h2>🎯 KTD Compliance</h2>

            <div class="card-number" id="ktdCompliance">
                Loading...
            </div>

        </div>

        <div class="card">

            <h2>🏢 Properties</h2>

            <div class="card-number" id="propertyCount">
                Loading...
            </div>

        </div>

    </div>

    <div class="quick-access">
        <h2>⚡ Quick Access</h2>

        <a href="agency-personnel.html" class="button">
            👮 Personnel
        </a>

        <a href="agency-reports.html" class="button">
            📊 Reports
        </a>

        <a href="assessment-results.html" class="button">
            📚 Assessment Results
        </a>

    </div>

</div>

<script>

const agency = "AGLIPAY";

const apiUrl =
"https://script.google.com/macros/s/AKfycbxt7eLgH4ryxGiffBbNcZ61F0UYJ1JJrx_fbS21A5yH4ZSEhozcaEaQoli2Wbt2AxFb/exec";

fetch(
`${apiUrl}?action=agency&agency=${encodeURIComponent(agency)}`
)
.then(response => response.json())
.then(data => {

    document.getElementById("agencyName").innerText =
        data.agency;

    document.getElementById("personnelCount").innerText =
        data.personnel;

    document.getElementById("propertyCount").innerText =
        data.properties;

    document.getElementById("ktdCompliance").innerText =
        data.compliance + "%";

})
.catch(error => {

    console.error(error);

});

</script>

</body>
</html>

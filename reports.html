<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTD Reports Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
}

.header{
    background:linear-gradient(
        135deg,
        #065f46,
        #10b981
    );
    color:white;
    padding:30px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.number{
    font-size:32px;
    font-weight:bold;
    color:#10b981;
}

.label{
    color:#666;
    margin-top:8px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.section-title{
    font-size:20px;
    font-weight:bold;
    color:#065f46;
    margin-bottom:20px;
}

.agency-item{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
    cursor:pointer;
    transition:.3s;
}

.agency-item:hover{
    background:#f0fdf4;
}

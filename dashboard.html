<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTD LMS Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
}

.header{
    background:linear-gradient(
        135deg,
        #003366,
        #2563eb
    );
    color:white;
    padding:30px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:0 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-3px);
}
.section-title{
    font-size:20px;
    font-weight:bold;
    color:#003366;
    margin-bottom:20px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.label{
    color:#777;
    font-size:14px;
}

.value{
    font-size:18px;
    font-weight:bold;
    margin-top:5px;
}

.assessment-title{
    font-size:32px;
    font-weight:800;
    color:#111827;
    text-align:center;
    line-height:1.3;
}

.set-badge{
    display:inline-block;
    background:#dbeafe;
    color:#1e40af;
    padding:8px 14px;
    border-radius:999px;
    font-weight:bold;
    margin-top:10px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    margin-top:15px;
    margin-right:10px;
    font-weight:bold;
}

.btn-primary{
    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );
    color:white;
    box-shadow:0 5px 15px rgba(37,99,235,.3);
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-secondary{
    background:#f3f4f6;
    color:#111827;
}

.btn-secondary:hover{
    background:#e5e7eb;
}

.history-text{
    color:#666;
    line-height:1.6;
}

.status-open{
    background:#dcfce7;
    color:#166534;
}

.status-scheduled{
    background:#fef3c7;
    color:#92400e;
}

.status-closed{
    background:#fee2e2;
    color:#991b1b;
}

.status-badge{
    display:inline-block;
    padding:10px 18px;
    border-radius:999px;
    font-weight:bold;
    margin-top:10px;
}

@media(max-width:700px){

    .info-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="header">
    <h1>KTD LMS Dashboard</h1>
</div>

<div class="container">

    <div id="content" class="loading">
        Loading Dashboard...
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const email = params.get("email");

const apiUrl =
"https://script.google.com/macros/s/AKfycbxt7eLgH4ryxGiffBbNcZ61F0UYJ1JJrx_fbS21A5yH4ZSEhozcaEaQoli2Wbt2AxFb/exec?action=lms&email="
+ encodeURIComponent(email);

fetch(apiUrl)

.then(res => res.json())

.then(data => {

    const now = new Date();

const releaseDate = new Date(data.campaign.releaseDate);

const dueDate = new Date(data.campaign.dueDate);

let status = "OPEN";

if(now < releaseDate){
    status = "SCHEDULED";
}
else if(now > dueDate){
    status = "CLOSED";
}

    if(data.error){

        document.getElementById("content").innerHTML =
        `<div class="card">
            <h2>${data.error}</h2>
        </div>`;

        return;
    }

    document.getElementById("content").innerHTML = `

        <div class="card">

            <div class="section-title">
                Welcome, ${data.guard.name}
            </div>

            <div class="info-grid">

                <div>
                    <div class="label">Agency</div>
                    <div class="value">${data.guard.agency}</div>
                </div>

                <div>
                    <div class="label">Property</div>
                    <div class="value">${data.guard.property}</div>
                </div>

            </div>

        </div>


        <div class="card">

            <div class="section-title">
                Assessment History
            </div>

            <div class="history-text">
                View your previous assessment scores,
                completion status and training records.
            </div>

            <a
                class="btn btn-secondary"
                href="results.html?email=${data.guard.email}">
                View Results
            </a>

        </div>


        <div class="card">

            <div class="section-title">
                Current Assessment
            </div>

            <div class="assessment-title">
                ${data.assessment.assessmentName}
            </div>

            <br>
<div class="label">Status</div>
<div class="status-badge ${
status === 'OPEN'
? 'status-open'
: status === 'SCHEDULED'
? 'status-scheduled'
: 'status-closed'
}">
${status}
</div>​‌


            <div class="set-badge">
                Assigned Set: ${data.setInfo.set}
            </div>

            <br>

            <a
                class="btn btn-primary"
                href="${data.setInfo.formLink}"
                target="_blank">
                Start Assessment
            </a>

        </div>

    `;

})

.catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML =
    `<div class="card">
        Unable to load LMS data.
    </div>`;

});

</script>

</body>
</html>

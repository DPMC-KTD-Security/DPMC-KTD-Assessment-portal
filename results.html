<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTD Assessment Results</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.summary-card{
    background:#003366;
    color:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.assessment-card{
    background:white;
    border-left:5px solid #003366;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.10);
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
    color:#003366;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    javascript:history.back() class="back-link">
        ← Back
    </a>

    <div id="results">
        Loading...
    </div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const email =
params.get("email");

loadResults();

async function loadResults(){

try{

const response = await fetch(
"https://script.google.com/macros/s/AKfycbzs-rKuvbQ1rkbHyzeZ1k1BpWO_X_phusbmdG2XBxd7DeKPbLkOHJUZV0SoDPFCXAkjRA/exec?email=" +
encodeURIComponent(email)
);

const data = await response.json();

if(data.length === 0){

document.getElementById("results").innerHTML =
"<h3>No assessment records found.</h3>";

return;
}

const passedCount =
data.filter(x =>
x.status.toLowerCase().includes("pass")
).length;

const failedCount =
data.filter(x =>
x.status.toLowerCase().includes("fail")
).length;

let html = `

<div class="summary-card">

<h2>Assessment Summary</h2>

<p><strong>Name:</strong> ${data[0].name}</p>
<p><strong>Email:</strong> ${data[0].email}</p>
<p><strong>Property:</strong> ${data[0].property}</p>
<p><strong>Agency:</strong> ${data[0].agency}</p>

<hr>

<p><strong>Total Assessments:</strong> ${data.length}</p>
<p><strong>Passed:</strong> ${passedCount}</p>
<p><strong>Failed:</strong> ${failedCount}</p>

</div>
`;

data.forEach(item=>{

const statusClass =
item.status.toLowerCase().includes("pass")
? "pass"
: "fail";

html += `
<div class="assessment-card">

<h3>${item.assessment}</h3>

<p><strong>Score:</strong> ${item.score}</p>

<p><strong>Stage:</strong> ${item.stage}</p>

<p>
<strong>Status:</strong>
<span class="${statusClass}">
${item.status}
</span>
</p>

</div>
`;

});

document.getElementById("results").innerHTML =
html;

}catch(error){

document.getElementById("results").innerHTML =
"<p>Error loading records.</p>";

}

}

</script>

</body>
</html>
